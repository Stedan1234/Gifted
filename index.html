<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gifted ✦</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">

      <header class="app-header">
        <div class="title-group">
          <div class="logo-mark">✦</div>
          <h1>Gifted</h1>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon--light">☀︎</span>
          <span class="theme-icon theme-icon--dark">◗</span>
        </button>
      </header>

      <main class="main-content">

        <!-- Animated gift box mascot -->
        <div class="mascot-container" id="mascot-container">
          <svg class="mascot-svg" id="mascot-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="mascot-shadow" cx="80" cy="150" rx="38" ry="6" />
            <rect class="box-body" x="28" y="80" width="104" height="64" rx="7" />
            <rect class="box-lid" x="22" y="62" width="116" height="26" rx="7" />
            <rect class="ribbon" x="72" y="80" width="16" height="64" rx="3" />
            <rect class="ribbon" x="22" y="68" width="116" height="14" rx="3" />
            <ellipse class="bow" cx="62" cy="56" rx="20" ry="13" transform="rotate(-18 62 56)" />
            <ellipse class="bow" cx="98" cy="56" rx="20" ry="13" transform="rotate(18 98 56)" />
            <circle class="bow-knot" cx="80" cy="58" r="9" />
            <text class="sparkle sparkle-1" x="14" y="48" font-size="14">✦</text>
            <text class="sparkle sparkle-2" x="130" y="42" font-size="10">✦</text>
            <text class="sparkle sparkle-3" x="138" y="96" font-size="8">✦</text>
            <text class="sparkle sparkle-4" x="8" y="104" font-size="10">✦</text>
          </svg>
          <p class="mascot-label" id="mascot-label">Your personal gift expert</p>
        </div>

        <form id="gift-form" class="gift-form">
          <div class="input-section">
            <div class="input-wrapper">
              <textarea
                id="user-input"
                placeholder="Tell me about the person — their interests, your budget, the occasion..."
                rows="3"
              ></textarea>
              <div class="input-hint">Press <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> for new line</div>
            </div>
          </div>
        </form>

        <section class="output-section">
          <div id="output-container" class="hidden">
            <div id="output-content"></div>
          </div>
        </section>

      </main>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
